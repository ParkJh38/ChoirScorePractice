[versions]
# Deliberately retain the SDK 35-compatible foundation; toolchain upgrades are separate work.
agp = "8.9.2"
kotlin = "2.1.20"
junit = "4.13.2"
activity = "1.10.1"
lifecycle = "2.8.7"
androidx-test = "1.6.2"
espresso = "3.6.1"

[libraries]
androidx-test-core = { module = "androidx.test:core", version = "1.6.1" }
androidx-espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espresso" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
